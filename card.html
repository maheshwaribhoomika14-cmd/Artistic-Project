<!doctype html>
<html lang="en">

<head>
    <title>Artistic - Art& Craft Store</title>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
        integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
    <link rel="stylesheet" href="index.css">
          <link rel="shortcut icon" href="icon/download.png" type="">

          <style>
    body {
        font-family: Arial, sans-serif;
        background: #f5f5f5;
    }
    .cart {
        width: 900px;
        margin: 40px auto;
        background: #fff;
        padding: 20px;
        border-radius: 6px;
    }
    h2 {
        margin-bottom: 20px;
    }
    table {
        width: 100%;
        border-collapse: collapse;
    }
    th, td {
        padding: 12px;
        border-bottom: 1px solid #ddd;
        text-align: center;
    }
    th {
        background: #f0f0f0;
    }
    .product {
        text-align: left;
        display: flex;
        align-items: center;
        gap: 10px;
    }
    .product img {
        width: 40px;
        height: 40px;
        border-radius: 50%;
    }
    .qty {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 5px;
    }
    .qty button {
        width: 28px;
        height: 28px;
        cursor: pointer;
    }
    .remove {
        color: red;
        cursor: pointer;
        font-size: 18px;
    }
    .bottom {
        display: flex;
        justify-content: space-between;
        margin-top: 20px;
        align-items: center;
    }
    .total-box {
        text-align: right;
    }
    .btn {
        padding: 10px 18px;
        border: none;
        cursor: pointer;
        border-radius: 4px;
    }
    .btn-back {
        background: #ddd;
    }
    .btn-checkout {
        background: #9ea18e;
        color: #fff;
    }
</style>

</head>

<body>

  
<div class="cart">
    <h2>Shopping Cart</h2>

    <table>
        <thead>
            <tr>
                <th>Product Name & Details</th>
                <th>Price</th>
                <th>Quantity</th>
                <th>Total</th>
                <th></th>
            </tr>
        </thead>
        <tbody id="cartBody">
            <tr data-price="57.55">
                <td class="product">
                    <img src="image/purse1.jpg" height="200px" width="100%">
                    <div>
                        <strong>Cotton Purse</strong><br>
                        Color: Red | Size: EU 37
                    </div>
                </td>
                <td>$57.55</td>
                <td>
                    <div class="qty">
                        <button onclick="changeQty(this,-1)">-</button>
                        <span>2</span>
                        <button onclick="changeQty(this,1)">+</button>
                    </div>
                </td>
                <td class="rowTotal">$115.10</td>
                <td class="remove" onclick="removeRow(this)">✖</td>
            </tr>

            <tr data-price="1049">
                <td class="product">
                    <img src="image/blue.webp">
                    <div>
                        <strong>China Flower</strong><br>
                        Storage: 32GB | Warranty: 1 year
                    </div>
                </td>
                <td>$1049.00</td>
                <td>
                    <div class="qty">
                        <button onclick="changeQty(this,-1)">-</button>
                        <span>1</span>
                        <button onclick="changeQty(this,1)">+</button>
                    </div>
                </td>
                <td class="rowTotal">$1049.00</td>
                <td class="remove" onclick="removeRow(this)">✖</td>
            </tr>
        </tbody>
    </table>

    <div class="bottom">
        <div>
            Promocode <br>
            <input type="text" value="ABC">
        </div>

        <div class="total-box">
            Discount: $20 <br>
            <strong>Total Price: $<span id="grandTotal">2194.10</span></strong>
        </div>
    </div>

    <div class="bottom">
        <button class="btn btn-back">Back to shopping</button>
        <a href="checkout.html"><button class="btn btn-checkout">Checkout</button></a>
    </div>
</div>

<script>
function changeQty(btn, change) {
    let qtySpan = btn.parentElement.querySelector("span");
    let qty = parseInt(qtySpan.innerText);
    qty += change;
    if (qty < 1) return;
    qtySpan.innerText = qty;

    let row = btn.closest("tr");
    let price = parseFloat(row.dataset.price);
    row.querySelector(".rowTotal").innerText = "$" + (price * qty).toFixed(2);
    calculateTotal();
}

function removeRow(el) {
    el.closest("tr").remove();
    calculateTotal();
}

function calculateTotal() {
    let totals = document.querySelectorAll(".rowTotal");
    let sum = 0;
    totals.forEach(t => {
        sum += parseFloat(t.innerText.replace("$",""));
    });
    let discount = 20;
    document.getElementById("grandTotal").innerText = (sum - discount).toFixed(2);
}

calculateTotal();
</script>


    



    <!-- Optional JavaScript -->
    <!-- jQuery first, then Popper.js, then Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"
        integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo"
        crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"
        integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1"
        crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"
        integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM"
        crossorigin="anonymous"></script>
</body>

</html>
