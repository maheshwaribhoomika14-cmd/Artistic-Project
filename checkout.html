<!doctype html>
<html lang="en">
  <head>
    <title>Artistic - Art& Craft Store</title>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
        <link rel="stylesheet" href="index.css">
          <link rel="shortcut icon" href="icon/download.png" type="">


          <style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: Arial, sans-serif;
}
body{
  background:#f5f6fa;
}
.container{
  max-width:1100px;
  margin:40px auto;
  display:grid;
  grid-template-columns:2fr 1fr;
  gap:30px;
}
.box{
  background:#fff;
  padding:25px;
  border-radius:10px;
}
h2{
  margin-bottom:20px;
}
label{
  font-size:14px;
  margin-top:15px;
  display:block;
}
input,select{
  width:100%;
  padding:12px;
  margin-top:6px;
  border:1px solid #ccc;
  border-radius:6px;
}
.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

/* Order summary */
.item{
  display:flex;
  align-items:center;
  margin-bottom:15px;
}
.item img{
  width:55px;
  height:55px;
  border-radius:6px;
  object-fit:cover;
}
.item div{
  margin-left:10px;
}
.price{
  margin-left:auto;
  font-weight:bold;
}
.summary p{
  display:flex;
  justify-content:space-between;
  margin:10px 0;
}
.summary hr{
  margin:15px 0;
}
.total{
  font-size:18px;
  font-weight:bold;
  color:black;
}
button{
  width:100%;
  padding:14px;
  background:#9ea18e;
  border:none;
  color:#fff;
  font-size:16px;
  border-radius:8px;
  cursor:pointer;
}
button:hover{
  background:#e85b00;
}
@media(max-width:900px){
  .container{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

 <div class="container">

  <!-- LEFT -->
  <div class="box">
    <h2>Checkout</h2>

    <label>Full Name</label>
    <input type="text" placeholder="John Doe">

    <label>Email</label>
    <input type="email" placeholder="john@email.com">

    <label>Phone</label>
    <input type="text" placeholder="+1 234 567 890">

    <div class="row">
      <div>
        <label>City</label>
        <input type="text">
      </div>
      <div>
        <label>ZIP</label>
        <input type="text">
      </div>
    </div>

    <label>Country</label>
    <select>
      <option>Select Country</option>
      <option>USA</option>
      <option>Canada</option>
      <option>India</option>
    </select>
  </div>

  <!-- RIGHT -->
  <div class="box">
    <h2>Order Summary</h2>

    <div class="item">
      <img src="image/purse1.jpg">
      <div>
        <p> Cotton Purse</p>
        <small>Qty: 1</small>
      </div>
      <span class="price">$20</span>
    </div>

    <div class="item">
      <img src="image/blue.webp">
      <div>
        <p>China Flower</p>
        <small>Qty: 1</small>
      </div>
      <span class="price">$25</span>
    </div>

    <div class="summary">
      <p>Subtotal <span>$45</span></p>
      <p>Shipping <span>$5</span></p>
      <hr>
      <p class="total">Total <span>$50</span></p>
    </div>

    <button>Pay Now</button>
  </div>

</div>


      





    <!-- Optional JavaScript -->
    <!-- jQuery first, then Popper.js, then Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js" integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js" integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1" crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js" integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM" crossorigin="anonymous"></script>
  </body>
</html>
