<h3>4. Nested if statement</h3>
<p>Enter your score to calculate your grade: </p>

<form action="#" id="gradeform">
<label for="score">Enter Your Score</label>
<input type="number" id="score" name="score" min="0" max="100">

<button type="submit">Calculate Grade</button>

</form>

<p id="nested_if"></p>
<br><br><br>

<script>
    document.getElementById("gradeform").addEventListener('submit', function(event){
        event.preventDefault();


        let score = document.getElementById("score").value;

        let grade = "";

        if (score>=0 && score <=100){
            if(score>90 &&  score<=100){
                grade = "A";
            }
            else if (score>75 && score<=89){
                grade = "B";
            }
            else if(score>50 && score<=74){
                grade = "C";
            }
            else  if(score>35 && score<=49){
                grade = "D";
            }
            else {
                grade = "Fail";
            }
            document.getElementById("nested_if").innerHTML = "Your grade for score " + score + "is" + grade;
        }

        else {
            document.getElementById("nested_if").innerHTML = "please enter a valid score between 0 and 100";
        }


    })
</script>
